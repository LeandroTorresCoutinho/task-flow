databaseChangeLog:
  - changeSet:
      id: task-002-create-tasks
      author: task-flow
      changes:
        - createTable:
            schemaName: task_service
            tableName: tasks
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: tasks_pkey
                    nullable: false
              - column:
                  name: owner_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: due_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - sql:
            sql: >-
              ALTER TABLE task_service.tasks
              ADD CONSTRAINT tasks_status_check
              CHECK (status IN ('TODO', 'IN_PROGRESS', 'DONE'))
        - createIndex:
            schemaName: task_service
            tableName: tasks
            indexName: idx_tasks_owner_id
            columns:
              - column:
                  name: owner_id
