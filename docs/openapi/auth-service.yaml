openapi: 3.1.0
info:
  title: Task Flow Auth API
  version: 1.0.0
  description: Registers users, issues RS256 access tokens, and publishes the signing key.
servers:
  - url: http://localhost:8081
    description: Local Docker Compose
tags:
  - name: Authentication
  - name: Discovery
paths:
  /api/v1/auth/register:
    post:
      tags: [Authentication]
      summary: Register a user
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          description: Email is already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/auth/login:
    post:
      tags: [Authentication]
      summary: Exchange credentials for an access token
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Credentials accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Token"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: Email or password is incorrect
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /.well-known/jwks.json:
    get:
      tags: [Discovery]
      summary: Get public JWT verification keys
      operationId: getJwkSet
      responses:
        "200":
          description: JSON Web Key Set containing the active RSA public key
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
components:
  responses:
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
          examples: [developer@example.com]
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          description: Must also be at most 72 UTF-8 bytes.
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 72
    User:
      type: object
      required: [id, email, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        createdAt:
          type: string
          format: date-time
    Token:
      type: object
      required: [accessToken, tokenType, expiresIn]
      properties:
        accessToken:
          type: string
          description: RS256 JSON Web Token.
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
          format: int64
          description: Token lifetime in seconds.
    ApiError:
      type: object
      required: [timestamp, status, code, message]
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        code:
          type: string
          examples: [VALIDATION_ERROR]
        message:
          type: string
