spring:
  application:
    name: auth-service
  r2dbc:
    url: "${AUTH_DB_R2DBC_URL:r2dbc:postgresql://localhost:5432/task_flow?schema=auth_service}"
    username: "${AUTH_DB_USERNAME:task_flow}"
    password: "${AUTH_DB_PASSWORD:task_flow}"
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    url: "${AUTH_DB_JDBC_URL:jdbc:postgresql://localhost:5432/task_flow}"
    user: "${AUTH_DB_USERNAME:task_flow}"
    password: "${AUTH_DB_PASSWORD:task_flow}"
    default-schema: auth_service
    liquibase-schema: auth_service

server:
  port: "${AUTH_SERVICE_PORT:8081}"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
