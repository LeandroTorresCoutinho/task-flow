spring:
  application:
    name: auth-service
  r2dbc:
    url: "${AUTH_DB_R2DBC_URL:r2dbc:postgresql://localhost:5432/task_flow?schema=auth_service}"
    username: "${AUTH_DB_USERNAME:task_flow}"
    password: "${AUTH_DB_PASSWORD:task_flow}"
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    url: "${AUTH_DB_JDBC_URL:jdbc:postgresql://localhost:5432/task_flow}"
    user: "${AUTH_DB_USERNAME:task_flow}"
    password: "${AUTH_DB_PASSWORD:task_flow}"
    default-schema: public
    liquibase-schema: public
    database-change-log-table: auth_database_changelog
    database-change-log-lock-table: auth_database_changelog_lock

server:
  port: "${AUTH_SERVICE_PORT:8081}"

auth:
  jwt:
    private-key: "${AUTH_JWT_PRIVATE_KEY:file:./.secrets/jwt-private.pem}"
    public-key: "${AUTH_JWT_PUBLIC_KEY:file:./.secrets/jwt-public.pem}"
    key-id: "${AUTH_JWT_KEY_ID:task-flow-key-1}"
    issuer: "${AUTH_JWT_ISSUER:https://task-flow.local/auth}"
    ttl: "${AUTH_JWT_TTL:PT1H}"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
