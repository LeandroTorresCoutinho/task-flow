services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-task_flow}"
      POSTGRES_USER: "${POSTGRES_USER:-task_flow}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-task_flow}"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    environment:
      AUTH_DB_R2DBC_URL: "r2dbc:postgresql://postgres:5432/${POSTGRES_DB:-task_flow}?schema=auth_service"
      AUTH_DB_JDBC_URL: "jdbc:postgresql://postgres:5432/${POSTGRES_DB:-task_flow}"
      AUTH_DB_USERNAME: "${POSTGRES_USER:-task_flow}"
      AUTH_DB_PASSWORD: "${POSTGRES_PASSWORD:-task_flow}"
      AUTH_JWT_PRIVATE_KEY: "file:/run/app-secrets/jwt-private.pem"
      AUTH_JWT_PUBLIC_KEY: "file:/run/app-secrets/jwt-public.pem"
      AUTH_JWT_KEY_ID: "${AUTH_JWT_KEY_ID:-task-flow-key-1}"
      AUTH_JWT_ISSUER: "http://auth-service:8081"
      AUTH_JWT_TTL: "${AUTH_JWT_TTL:-PT1H}"
    ports:
      - "${AUTH_SERVICE_PORT:-8081}:8081"
    secrets:
      - source: jwt-private-key
        target: /run/source-secrets/jwt-private.pem
      - source: jwt-public-key
        target: /run/source-secrets/jwt-public.pem
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8081/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

  task-service:
    build:
      context: .
      dockerfile: task-service/Dockerfile
    environment:
      TASK_DB_R2DBC_URL: "r2dbc:postgresql://postgres:5432/${POSTGRES_DB:-task_flow}?schema=task_service"
      TASK_DB_JDBC_URL: "jdbc:postgresql://postgres:5432/${POSTGRES_DB:-task_flow}"
      TASK_DB_USERNAME: "${POSTGRES_USER:-task_flow}"
      TASK_DB_PASSWORD: "${POSTGRES_PASSWORD:-task_flow}"
      TASK_JWT_ISSUER: "http://auth-service:8081"
      TASK_JWT_JWK_SET_URI: "http://auth-service:8081/.well-known/jwks.json"
    ports:
      - "${TASK_SERVICE_PORT:-8082}:8082"
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8082/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

volumes:
  postgres-data:

secrets:
  jwt-private-key:
    file: ./.secrets/jwt-private.pem
  jwt-public-key:
    file: ./.secrets/jwt-public.pem
